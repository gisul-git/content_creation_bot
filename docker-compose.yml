# Docker Compose Configuration for Content Creation Bot
# Save this as: docker-compose.yml (in project root directory)
# Optimized version - shares MongoDB and Redis with GisulMatch to save resources

version: '3.8'

services:
  # Backend API (FastAPI) - Using port 8001 to avoid conflict with GisulMatch
  backend:
    image: ${DOCKERHUB_USERNAME:-gisul}/content_creation_bot-backend:latest
    container_name: content_bot_backend
    restart: unless-stopped
    ports:
      - "8001:8000"  # External port 8001 (GisulMatch uses 8000)
    environment:
      # Database - Shared MongoDB with GisulMatch (different database name)
      MONGODB_URL: mongodb://gisulmatch-mongo:27017/content_creation_bot
      MONGODB_DB_NAME: content_creation_bot
      # Redis - Shared Redis with GisulMatch (using DB 2 for isolation)
      REDIS_URL: redis://gisulmatch-redis:6379/2
      # Application Settings
      ENVIRONMENT: production
      DEBUG: "false"
      # Security
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production-min-32-chars}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      # URLs - using port 8001 for backend
      FRONTEND_URL: ${FRONTEND_URL:-http://103.173.99.253:3000}
      BACKEND_URL: ${BACKEND_URL:-http://103.173.99.253:8001}
      # CORS - allow frontend on port 3000
      ALLOWED_ORIGINS: http://localhost:3000,http://103.173.99.253:3000,http://103.173.99.253
      # Email Configuration (AWS SES)
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      SES_SENDER_EMAIL: ${SES_SENDER_EMAIL:-noreply@yourdomain.com}
      # OAuth Credentials
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://103.173.99.253:8001/api/v1/auth/google/callback}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-common}
      MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI:-http://103.173.99.253:8001/api/auth/callback/azure-ad}
      # OpenAI API
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    networks:
      - gisulmatch_net  # Join GisulMatch network to access shared MongoDB and Redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend (Next.js) - Port 3000 is available (no conflict with GisulMatch)
  frontend:
    image: ${DOCKERHUB_USERNAME:-gisul}/content_creation_bot-frontend:latest
    container_name: content_bot_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"  # Port 3000 is free (GisulMatch uses 8080)
    environment:
      # API URL - points to backend on port 8001
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://103.173.99.253:8001}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://103.173.99.253:3000}
      NODE_ENV: production
    depends_on:
      - backend
    networks:
      - gisulmatch_net  # Join GisulMatch network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

# Use existing GisulMatch network (shares MongoDB and Redis)
networks:
  gisulmatch_net:
    external: true
