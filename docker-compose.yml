# Docker Compose Configuration for Content Creation Bot
# Save this as: docker-compose.yml (in project root directory)
# This configuration avoids port conflicts with GisulMatch project

version: '3.8'

services:
  # MongoDB Database - Using different port (27018) to avoid conflict
  mongodb:
    image: mongo:7
    container_name: content_bot_mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"  # Changed from 27017 to avoid GisulMatch conflict
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-changeme123}
      MONGO_INITDB_DATABASE: content_creation_bot
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - content_bot_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache - Using different port (6380) to avoid conflict
  redis:
    image: redis:7-alpine
    container_name: content_bot_redis
    restart: unless-stopped
    ports:
      - "6380:6379"  # Changed from 6379 to avoid GisulMatch conflict
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-changeme123}
    volumes:
      - redis_data:/data
    networks:
      - content_bot_network
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "changeme123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (FastAPI) - Using different port (8001) to avoid conflict
  backend:
    image: ${DOCKERHUB_USERNAME:-gisul}/content_creation_bot-backend:latest
    container_name: content_bot_backend
    restart: unless-stopped
    ports:
      - "8001:8000"  # Changed external port from 8000 to 8001 (GisulMatch uses 8000)
    environment:
      # Database - connects to internal MongoDB port 27017
      MONGODB_URL: mongodb://admin:${MONGO_PASSWORD:-changeme123}@mongodb:27017/content_creation_bot?authSource=admin
      MONGODB_DB_NAME: content_creation_bot
      # Redis - connects to internal Redis port 6379
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme123}@redis:6379/0
      # Application
      ENVIRONMENT: production
      DEBUG: "false"
      # Security
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production-min-32-chars}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      # URLs - using port 8001 for backend
      FRONTEND_URL: ${FRONTEND_URL:-http://103.173.99.253:3000}
      BACKEND_URL: ${BACKEND_URL:-http://103.173.99.253:8001}
      # CORS - allow frontend on port 3000
      ALLOWED_ORIGINS: http://localhost:3000,http://103.173.99.253:3000,http://103.173.99.253
      # Email Configuration (AWS SES)
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      SES_SENDER_EMAIL: ${SES_SENDER_EMAIL:-noreply@yourdomain.com}
      # OAuth Credentials
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://103.173.99.253:8001/api/v1/auth/google/callback}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-common}
      MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI:-http://103.173.99.253:8001/api/auth/callback/azure-ad}
      # OpenAI API
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - content_bot_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend (Next.js) - Port 3000 is available (no conflict)
  frontend:
    image: ${DOCKERHUB_USERNAME:-gisul}/content_creation_bot-frontend:latest
    container_name: content_bot_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"  # Port 3000 is free (GisulMatch uses 8080)
    environment:
      # API URL - points to backend on port 8001
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://103.173.99.253:8001}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://103.173.99.253:3000}
      NODE_ENV: production
    depends_on:
      - backend
    networks:
      - content_bot_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  content_bot_network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  redis_data:
    driver: local
