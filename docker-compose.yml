# Docker Compose Configuration

# Save this as: docker-compose.yml (in root directory)

version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: content_bot_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-changeme123}
      MONGO_INITDB_DATABASE: content_creation_bot
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - content_bot_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: content_bot_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-changeme123}
    volumes:
      - redis_data:/data
    networks:
      - content_bot_network
    healthcheck:
      # Note: Uses default password 'changeme123'. If you change REDIS_PASSWORD, update this command.
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "changeme123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (FastAPI)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: content_bot_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Database
      MONGODB_URL: mongodb://admin:${MONGO_PASSWORD:-changeme123}@mongodb:27017/content_creation_bot?authSource=admin
      MONGODB_DB_NAME: content_creation_bot
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme123}@redis:6379/0
      
      # Application
      ENVIRONMENT: production
      DEBUG: "false"
      
      # Security
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production-min-32-chars}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      
      # Frontend URL
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8000}
      
      # CORS
      ALLOWED_ORIGINS: http://localhost:3000,http://103.173.99.253:3000,http://103.173.99.253
      
      # Email (configure with your SMTP settings)
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      SES_SENDER_EMAIL: ${SES_SENDER_EMAIL:-noreply@yourdomain.com}
      
      # OAuth (add your credentials)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://103.173.99.253:8000/api/v1/auth/google/callback}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-common}
      MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI:-http://103.173.99.253:8000/api/auth/callback/azure-ad}
      
      # OpenAI
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - content_bot_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: content_bot_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # API URL - point to backend
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://103.173.99.253:8000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://103.173.99.253:3000}
      NODE_ENV: production
    depends_on:
      - backend
    networks:
      - content_bot_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  content_bot_network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  redis_data:
    driver: local

