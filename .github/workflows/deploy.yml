# GitHub Actions CI/CD Pipeline
# Save this as: .github/workflows/deploy.yml

name: CI/CD - Build, Push & Deploy

on:
  push:
    branches:
      - dev
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Log in to DockerHub
      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 4: Build and Push Backend Image
      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/content_creation_bot-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/content_creation_bot-backend:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/content_creation_bot-backend:latest
          cache-to: type=inline

      # Step 5: Build and Push Frontend Image
      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/content_creation_bot-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/content_creation_bot-frontend:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/content_creation_bot-frontend:latest
          cache-to: type=inline

      # Step 6: Deploy to VM via SSH
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            # Navigate to project directory
            cd /opt/content_creation_bot || exit 1
            
            # Pull latest images
            echo "Pulling latest Docker images..."
            docker-compose pull
            
            # Stop and remove old containers
            echo "Stopping old containers..."
            docker-compose down
            
            # Start new containers
            echo "Starting new containers..."
            docker-compose up -d
            
            # Wait for services to be healthy
            echo "Waiting for services to start..."
            sleep 10
            
            # Show running containers
            docker-compose ps
            
            # Clean up old images
            echo "Cleaning up old Docker images..."
            docker image prune -af --filter "until=24h"
            
            echo "✅ Deployment completed successfully!"

      # Step 7: Verify Deployment
      - name: Verify Backend Health
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            echo "Checking backend health..."
            curl -f http://localhost:8000/health || echo "⚠️ Backend health check failed"
            echo "Checking frontend..."
            curl -f http://localhost:3000 || echo "⚠️ Frontend health check failed"

